networks:
  pbx_net:
    driver: bridge
    name: pbx_net
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1

volumes:
  mariadb_data:
  ollama_data:

services:

  # ─── Base de datos ────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: pbx_db
    networks: [pbx_net]
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pbx_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-asterisk_gui}
      MYSQL_USER: ${DB_USER:-pbxuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pbx_pass}
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbx_backend
    networks: [pbx_net]
    ports:
      - "8001:8000"      # 8000 ocupado por nextcore-testing-nginx
    env_file: ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/asterisk/etc:/etc/asterisk
      - /var/spool/asterisk:/var/spool/asterisk
      - /var/lib/asterisk/sounds/custom:/var/lib/asterisk/sounds/custom
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Ollama (LLM local) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: pbx_ollama
    networks: [pbx_net]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    # Después del primer arranque descarga el modelo con:
    #   docker exec pbx_ollama ollama pull llama3.2:3b

  # ─── Voice Agent ──────────────────────────────────────────────────────────
  voice-agent:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile
    container_name: pbx_voice_agent
    networks:
      pbx_net:
        ipv4_address: 10.10.10.20   # IP fija: Asterisk envía RTP a esta IP
    ports:
      - "8100:8100"                   # health/API interna
      - "10000-10100:10000-10100/udp" # puertos RTP (uno por llamada simultánea)
    env_file: ./voice-agent/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pbx_frontend
    networks: [pbx_net]
    ports:
      - "8090:80"        # 3000 ocupado por next-sri-api
    depends_on:
      - backend
    restart: unless-stopped
